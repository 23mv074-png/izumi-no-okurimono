<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会場マップ｜泉からの贈りもの</title><link rel="stylesheet" href="CSS/map.css"></head><body>
<button class="menu-toggle" type="button" aria-label="メニューを開く" aria-expanded="false"><span></span><span></span><span></span></button><div class="menu-overlay" aria-hidden="true"><nav class="menu-panel" aria-label="メインメニュー"><a href="index.html#top">TOP</a><a href="index.html#about">この企画について</a><a href="story.html">絵本を読む</a><a href="stamp.html">スタンプラリー</a><a href="map.html">会場マップ</a></nav></div>
<main class="map-main"><header><p class="en">MAP</p><h1>会場マップ</h1><div class="water-line"></div><p class="lead">5つのスタンプを探しながら、<br>2つの建物を巡ろう。</p></header>
<div class="intro"><span class="star">★</span> 黄色い星がスタンプの設置場所です。<p>図をタップすると大きく表示できます。</p></div>
<section class="overview"><h2>会場全体</h2><button class="map-image" data-full="images/venue/venue_full.jpg" aria-label="会場全体のマップを拡大"><img src="images/venue/venue_full.jpg" alt="A・B・C棟とD棟の各階、受付、スタンプ位置を示した会場全体マップ"></button></section>
<section class="floor-group"><h2>A・B・C棟</h2><p class="section-desc">階ごとに確認できます。</p>
<article class="floor"><h3>2階</h3><button class="map-image" data-full="images/venue/abc_2f.jpg" aria-label="A・B・C棟2階を拡大"><img src="images/venue/abc_2f.jpg" alt="A・B・C棟 2階の配置図"></button></article>
<article class="floor"><h3>1階</h3><button class="map-image" data-full="images/venue/abc_1f.jpg" aria-label="A・B・C棟1階を拡大"><img src="images/venue/abc_1f.jpg" alt="A・B・C棟 1階の配置図"></button></article>
<article class="floor"><h3>B棟 1階</h3><button class="map-image" data-full="images/venue/b_1f.jpg" aria-label="B棟1階を拡大"><img src="images/venue/b_1f.jpg" alt="B棟 1階の配置図"></button></article>
<article class="floor"><h3>B棟 2階</h3><button class="map-image" data-full="images/venue/b_2f.jpg" aria-label="B棟2階を拡大"><img src="images/venue/b_2f.jpg" alt="B棟 2階の配置図"></button></article></section>
<section class="floor-group"><h2>D棟</h2><article class="floor"><h3>1階・建物間の移動</h3><button class="map-image" data-full="images/venue/d_1f.jpg" aria-label="D棟1階と移動経路を拡大"><img src="images/venue/d_1f.jpg" alt="D棟1階とA・B・C棟からの移動経路"></button></article></section>
<p class="map-note">トイレ・エレベーター・受付などの位置は、会場全体図でも確認できます。</p><a class="cta" href="stamp.html">スタンプラリーを見る →</a><nav class="bottom-links"><a href="index.html">TOPへ戻る</a><a href="story.html">絵本を読む</a></nav></main>
<div id="zoom" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="会場マップの拡大表示"><button id="zoomClose" class="close" type="button" aria-label="閉じる">×</button><div class="zoom-scroller"><img id="zoomImage" alt="拡大した会場マップ"></div><p>指で拡大・スクロールして確認できます</p></div>
<script src="js/main.js"></script><script src="js/map.js"></script></body></html>
